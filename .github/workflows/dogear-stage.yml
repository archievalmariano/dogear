# Friday: stage next week (PUBLISHING.md §4). See _dogear-publish.yml.
# A first-attempt SCHEDULED run on main is routed to the unattended production-scheduled
# environment by _dogear-publish.yml's route job (PUBLISHING §4b); a manual run is reviewed.
# Scheduled runs act only when PUBLICATION_ENABLED == 'true', on PUBLICATION_TARGET
# (default staging). Nothing else starts it on a schedule: the dogear-scheduler Worker is
# a watch-only watchdog that alerts when a run is missing or red (PUBLISHING §4c).
name: DOGEAR stage

on:
  # INTENTIONALLY DISABLED until deployment approval (G10): this workflow is disabled in
  # the repository's Actions settings, so neither the schedule nor a manual run can start it.
  schedule:
    - cron: "7 3 * * 5"   # Fri 03:07 UTC = 11:07 PHT
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      week:
        description: "A specific Monday (YYYY-MM-DD); empty = next week"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  stage:
    if: ${{ github.event_name != 'schedule' || vars.PUBLICATION_ENABLED == 'true' }}
    uses: ./.github/workflows/_dogear-publish.yml
    secrets: inherit
    with:
      target: ${{ inputs.target || vars.PUBLICATION_TARGET || 'staging' }}
      op: ${{ inputs.week && 'stage' || 'stage-next' }}
      week: ${{ inputs.week }}
