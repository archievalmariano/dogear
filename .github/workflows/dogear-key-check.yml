# Deploy-key isolation check: manual only, ONE Environment per run, from main.
# It holds no R2 or other credentials, publishes nothing and writes nothing: each
# key is tried read (shallow clone, deleted) and write (`git push --dry-run`)
# against all three private repositories, and the access must match the design
# exactly (tools/key_check.sh). The log shows only that matrix.
# The production Environment asks its required reviewer before this job starts.
# One job per Environment, each naming it literally (never from an input), so no
# dispatch can reach any other Environment, production-scheduled included
# (PUBLISHING §4b; tests/test_hosting.py RoutingBoundaryTests). Exactly one runs.
name: DOGEAR deploy-key check

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The one Environment whose keys to check
        type: choice
        options: [editorial-gate, staging, production]
        required: true

permissions:
  contents: read

jobs:
  keys-editorial-gate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.environment == 'editorial-gate' }}
    runs-on: ubuntu-latest
    environment: editorial-gate
    timeout-minutes: 5
    concurrency:
      group: dogear-key-check
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deploy-key access (dry runs only)
        env:
          ENVIRONMENT: editorial-gate
          OWNER: ${{ github.repository_owner }}
          EDITORIAL_KEY: ${{ secrets.EDITORIAL_DEPLOY_KEY }}
          DATA_KEY: ${{ secrets.PUBLICATION_DATA_DEPLOY_KEY }}
        run: bash tools/key_check.sh

  keys-staging:
    if: ${{ github.ref == 'refs/heads/main' && inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: dogear-key-check
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deploy-key access (dry runs only)
        env:
          ENVIRONMENT: staging
          OWNER: ${{ github.repository_owner }}
          EDITORIAL_KEY: ${{ secrets.EDITORIAL_DEPLOY_KEY }}
          DATA_KEY: ${{ secrets.PUBLICATION_DATA_DEPLOY_KEY }}
        run: bash tools/key_check.sh

  keys-production:
    if: ${{ github.ref == 'refs/heads/main' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: dogear-key-check
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deploy-key access (dry runs only)
        env:
          ENVIRONMENT: production
          OWNER: ${{ github.repository_owner }}
          EDITORIAL_KEY: ${{ secrets.EDITORIAL_DEPLOY_KEY }}
          DATA_KEY: ${{ secrets.PUBLICATION_DATA_DEPLOY_KEY }}
        run: bash tools/key_check.sh
