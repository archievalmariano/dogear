# Manual operations (PUBLISHING.md §4, §12): never scheduled. Production is a
# deliberate choice, twice: the `confirm_production` input must be typed exactly as
# "production" (a one-click mistake stops here, before any Environment or secret),
# and the run then waits for the required reviewer on the `production` Environment.
name: DOGEAR operate

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      op:
        type: choice
        options: [status, reconcile, launch, correct, rollback, restore, resume, abandon]
        default: status
      week: { description: "Monday YYYY-MM-DD (correct, rollback, restore)", type: string, default: "" }
      rev: { description: "Revision (restore; optional for rollback)", type: string, default: "" }
      expect_rev: { description: "The week's active revision now (correct)", type: string, default: "" }
      reason: { description: "One line (correct, rollback)", type: string, default: "" }
      txn: { description: "Transaction id (abandon, after inspection)", type: string, default: "" }
      confirm_production: { description: "Production only: type production to confirm", type: string, default: "" }

permissions:
  contents: read

jobs:
  # No Environment, no secrets: refuses production unless it was confirmed by typing it.
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm the target
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm_production }}
        run: |
          case "$TARGET" in
            staging) echo "target: staging" ;;
            production) [ "$CONFIRM" = production ] || { echo "::error::production needs confirm_production = production"; exit 1; }
                        echo "target: production (confirmed; the production Environment's reviewer decides next)" ;;
            *) echo "::error::target must be staging or production"; exit 1 ;;
          esac

  operate:
    needs: confirm
    uses: ./.github/workflows/_dogear-publish.yml
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      op: ${{ inputs.op }}
      week: ${{ inputs.week }}
      rev: ${{ inputs.rev }}
      expect_rev: ${{ inputs.expect_rev }}
      reason: ${{ inputs.reason }}
      txn: ${{ inputs.txn }}
